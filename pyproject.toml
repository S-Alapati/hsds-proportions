[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hsds-proportions"
version = "1.0.0"
description = "Assign long reads to Type I restriction-modification hsdS alleles from their 6mA motifs, in any bacterium"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Susanth Alapati" }]
keywords = ["nanopore", "methylation", "6mA", "phase variation", "restriction-modification", "shufflon", "bacteria"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["pysam>=0.21"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
hsds-proportions = "hsds_proportions.cli:main"

[project.urls]
Source = "https://github.com/S-Alapati/hsds-proportions"
Issues = "https://github.com/S-Alapati/hsds-proportions/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hsds_proportions = ["presets/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"
