<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 462" width="900" height="462" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>hsds-proportions</title>
  <desc>A police lineup of four bacteria in disguise, each holding a placard with a
  different recognition motif. The joke is the tool's job: working out which allele
  left the methylation behind.</desc>

  <defs>
    <style><![CDATA[
      .wall   { fill: #EDEEF0; }
      .rule   { stroke: #C4C8CE; stroke-width: 2; }
      .tick   { font: 500 11px ui-sans-serif, system-ui, sans-serif; fill: #9AA0A6; }
      .body   { stroke: #1F2430; stroke-width: 3; stroke-linejoin: round; }
      .ink    { fill: #1F2430; }
      .white  { fill: #FFFFFF; }
      .card   { fill: #FDFDFB; stroke: #1F2430; stroke-width: 2.4; }
      .motif  { font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1F2430; }
      .lens   { fill: #F2F4F7; stroke: #1F2430; stroke-width: 3; }
      .flag   { fill: none; stroke: #1F2430; stroke-width: 2.6; stroke-linecap: round; }
      .word   { font: 800 40px ui-sans-serif, system-ui, sans-serif; fill: #1F2430; }
      .tag    { font: 500 16px ui-sans-serif, system-ui, sans-serif; fill: #5F6368; }
      .quip   { font: italic 600 15px ui-sans-serif, system-ui, sans-serif; fill: #6B7280; }
    ]]></style>
  </defs>

  <rect class="wall" x="0" y="0" width="900" height="462" rx="18"/>

  <!-- height chart, in units a bacterium would care about -->
  <g>
    <line class="rule" x1="52" y1="112" x2="848" y2="112"/>
    <line class="rule" x1="52" y1="172" x2="848" y2="172"/>
    <line class="rule" x1="52" y1="232" x2="848" y2="232"/>
    <line class="rule" x1="52" y1="292" x2="848" y2="292"/>
    <text class="tick" x="36" y="116" text-anchor="end">3 µm</text>
    <text class="tick" x="36" y="176" text-anchor="end">2 µm</text>
    <text class="tick" x="36" y="236" text-anchor="end">1 µm</text>
    <text class="tick" x="36" y="296" text-anchor="end">0</text>
  </g>

  <!-- suspect 1: the full Groucho -->
  <g transform="translate(150,0)">
    <path class="flag" d="M -18 292 q -16 12 -6 26 q 10 14 -6 22"/>
    <path class="flag" d="M 18 292 q 16 12 6 26 q -10 14 6 22"/>
    <rect class="body" x="-38" y="120" width="76" height="172" rx="38" fill="#D55E00"/>
    <circle class="lens" cx="-13" cy="176" r="13"/>
    <circle class="lens" cx="15" cy="176" r="13"/>
    <line x1="0" y1="176" x2="2" y2="176" stroke="#1F2430" stroke-width="3"/>
    <circle class="ink" cx="-13" cy="177" r="3.4"/>
    <circle class="ink" cx="15" cy="177" r="3.4"/>
    <path class="ink" d="M 1 184 q 11 4 9 15 q -9 5 -18 0 q -2 -11 9 -15 Z"/>
    <path class="ink" d="M 1 202 q -22 -8 -26 8 q 14 6 26 -2 q 12 8 26 2 q -4 -16 -26 -8 Z"/>
    <rect class="card" x="-40" y="246" width="80" height="26" rx="4"/>
    <text class="motif" x="0" y="264" text-anchor="middle">TCA·TGT</text>
  </g>

  <!-- suspect 2: hat and a guilty little smile -->
  <g transform="translate(330,0)">
    <path class="flag" d="M -18 292 q -16 12 -6 26 q 10 14 -6 22"/>
    <path class="flag" d="M 18 292 q 16 12 6 26 q -10 14 6 22"/>
    <rect class="body" x="-38" y="120" width="76" height="172" rx="38" fill="#CC79A7"/>
    <g class="ink">
      <rect x="-27" y="112" width="54" height="9" rx="3"/>
      <rect x="-17" y="76" width="34" height="38" rx="3"/>
      <rect x="-17" y="96" width="34" height="8" fill="#FDFDFB"/>
    </g>
    <circle class="ink" cx="-12" cy="172" r="4.6"/>
    <circle class="ink" cx="14" cy="172" r="4.6"/>
    <path class="flag" d="M -13 194 q 14 12 27 0"/>
    <rect class="card" x="-40" y="246" width="80" height="26" rx="4"/>
    <text class="motif" x="0" y="264" text-anchor="middle">TCA·TTA</text>
  </g>

  <!-- suspect 3: shades, saying nothing -->
  <g transform="translate(510,0)">
    <path class="flag" d="M -18 292 q -16 12 -6 26 q 10 14 -6 22"/>
    <path class="flag" d="M 18 292 q 16 12 6 26 q -10 14 6 22"/>
    <rect class="body" x="-38" y="120" width="76" height="172" rx="38" fill="#009E73"/>
    <g class="ink">
      <path d="M -30 166 q 14 -5 28 0 q 14 -5 28 0 l 0 5 q -12 3 -14 0 q -4 16 -14 15 q -10 -1 -12 -14 q -2 -3 -16 0 Z"/>
    </g>
    <path class="flag" d="M -10 200 l 24 0"/>
    <rect class="card" x="-40" y="246" width="80" height="26" rx="4"/>
    <text class="motif" x="0" y="264" text-anchor="middle">GTA·TGT</text>
  </g>

  <!-- suspect 4: bow tie, whistling -->
  <g transform="translate(690,0)">
    <path class="flag" d="M -18 292 q -16 12 -6 26 q 10 14 -6 22"/>
    <path class="flag" d="M 18 292 q 16 12 6 26 q -10 14 6 22"/>
    <rect class="body" x="-38" y="120" width="76" height="172" rx="38" fill="#0072B2"/>
    <circle class="ink" cx="-12" cy="168" r="4.6"/>
    <circle class="ink" cx="14" cy="168" r="4.6"/>
    <ellipse class="ink" cx="1" cy="192" rx="7" ry="9"/>
    <g class="ink">
      <path d="M 1 216 l -20 -9 l 0 18 Z"/>
      <path d="M 1 216 l 20 -9 l 0 18 Z"/>
      <circle cx="1" cy="216" r="4.5"/>
    </g>
    <rect class="card" x="-40" y="246" width="80" height="26" rx="4"/>
    <text class="motif" x="0" y="264" text-anchor="middle">GTA·TTA</text>
  </g>

  <text class="quip" x="450" y="366" text-anchor="middle">“so which one of you methylated my DNA?”</text>
  <text class="word" x="450" y="414" text-anchor="middle">hsds-proportions</text>
  <text class="tag" x="450" y="440" text-anchor="middle">same genome, different disguise</text>
</svg>
